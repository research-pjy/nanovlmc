[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanovlm-replication"
version = "0.1.0"
description = "Controlled from-scratch NanoVLM visual encoder experiments"
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<3", "Pillow>=9.4", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nanovlm = "nanovlm.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

